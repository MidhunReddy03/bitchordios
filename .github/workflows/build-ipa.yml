name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build BitChord IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          cd BitChordIOS
          set -o pipefail
          xcodebuild archive \
            -project BitChordIOS.xcodeproj \
            -scheme BitChordIOS \
            -destination "generic/platform=iOS" \
            -archivePath BitChordIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log

      - name: Print Errors if Archive Failed
        if: failure()
        run: |
          cd BitChordIOS
          echo "==================== BUILD ERRORS ===================="
          grep -E "(error:|fatal error:|\*\* ARCHIVE FAILED \*\*)" xcodebuild.log -B 2 -A 3 || tail -n 150 xcodebuild.log
          echo "======================================================="

      - name: Package IPA
        run: |
          cd BitChordIOS
          mkdir -p Payload
          cp -r BitChordIOS.xcarchive/Products/Applications/BitChordIOS.app Payload/
          zip -qr BitChord.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-IPA
          path: BitChordIOS/BitChord.ipa
          retention-days: 14

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: BitChordIOS/xcodebuild.log
          retention-days: 7
