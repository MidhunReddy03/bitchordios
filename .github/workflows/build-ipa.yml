name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build BitChord IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          cd BitChordIOS
          xcodebuild archive \
            -project BitChordIOS.xcodeproj \
            -scheme BitChordIOS \
            -destination "generic/platform=iOS" \
            -archivePath BitChordIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log

      - name: Report Build Errors to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('BitChordIOS/xcodebuild.log', 'utf8');
              const lines = log.split('\n');
              const errors = lines.filter(l => l.includes('error:') || l.includes('fatal error:'));
              let summary = errors.slice(0, 50).join('\n');
              if (!summary) summary = lines.slice(-100).join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Build Failure Log: ' + context.sha.substring(0, 7),
                body: '### Xcodebuild Output:\n```\n' + summary + '\n```'
              });
            } catch (e) {
              console.log('Error creating issue:', e);
            }

      - name: Package IPA
        run: |
          cd BitChordIOS
          mkdir -p Payload
          cp -r BitChordIOS.xcarchive/Products/Applications/BitChordIOS.app Payload/
          zip -qr BitChord.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-IPA
          path: BitChordIOS/BitChord.ipa
          retention-days: 14

      - name: Release IPA on Success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1-ios
          name: "BitChord iOS v1.9.1 (iPhone 13)"
          files: BitChordIOS/BitChord.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
