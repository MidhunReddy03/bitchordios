name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build BitChord IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive and Package IPA
        run: |
          cd BitChordIOS
          set -o pipefail
          xcodebuild archive \
            -project BitChordIOS.xcodeproj \
            -scheme BitChordIOS \
            -destination "generic/platform=iOS" \
            -archivePath ./BitChord.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ../build.log

          echo "=== Finding .app in archive ==="
          APP_PATH=$(find ./BitChord.xcarchive -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr BitChord.ipa Payload
          rm -rf Payload
          ls -lh BitChord.ipa

      - name: Report Build Errors to Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('build.log', 'utf8');
              const lines = log.split('\n');
              const errors = lines.filter(l => l.includes('error:') || l.includes('fatal error:'));
              let summary = errors.slice(0, 50).join('\n');
              if (!summary) summary = lines.slice(-100).join('\n');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Build Failure Log: ' + context.sha.substring(0, 7),
                body: '### Xcodebuild Output:\n```\n' + summary + '\n```'
              });
            } catch (e) {
              console.log('Error creating issue:', e);
            }

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-IPA
          path: BitChordIOS/BitChord.ipa
          retention-days: 14

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        if: success() && startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.9.1
          name: "BitChord iOS v1.9.1 (iPhone 13)"
          body: "Automated BitChord iOS build for iPhone 13 (iOS 27.2.1 / iOS 16+ compatible). Sideload using AltStore, SideStore, Sideloadly, or TrollStore."
          files: BitChordIOS/BitChord.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
